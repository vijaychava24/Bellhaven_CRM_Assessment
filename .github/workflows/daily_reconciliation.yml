
name: Daily Bellhaven CRM Reconciliation

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconciliation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check CRM connection and approved changes
        env:
          CRM_BASE_URL: ${{ secrets.CRM_BASE_URL }}
          CRM_API_TOKEN: ${{ secrets.CRM_API_TOKEN }}
        run: python apply_approved_changes.py
